[tool.pytest.ini_options]
minversion = "9.0"
pythonpath = [".", "executaveis"]
testpaths = ["testes", "tests"]
# Ambos os diretórios contêm test_json_atomico.py; preserve os nomes auditados.
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["codigo_fonte"]

[tool.coverage.report]
show_missing = true
skip_covered = true
