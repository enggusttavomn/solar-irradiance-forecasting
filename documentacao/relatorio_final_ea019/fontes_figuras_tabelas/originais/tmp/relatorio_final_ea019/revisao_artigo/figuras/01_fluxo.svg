<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="715" viewBox="0 0 1200 715"><rect width="1200" height="715" fill="white"/><g font-family="Arial,sans-serif"><rect x="10" y="15" width="53" height="192" rx="6" fill="#245680" stroke="#245680" stroke-width="1.8"/><text x="36" y="121" font-size="33" text-anchor="middle" font-weight="700" fill="white">A</text><text x="79" y="41" font-size="24" text-anchor="start" font-weight="700" fill="#245680">DADOS E TAREFAS</text><rect x="10" y="237" width="53" height="192" rx="6" fill="#B65B35" stroke="#B65B35" stroke-width="1.8"/><text x="36" y="343" font-size="33" text-anchor="middle" font-weight="700" fill="white">B</text><text x="79" y="263" font-size="24" text-anchor="start" font-weight="700" fill="#B65B35">SELEÇÃO E REFIT</text><rect x="10" y="459" width="53" height="192" rx="6" fill="#35776C" stroke="#35776C" stroke-width="1.8"/><text x="36" y="565" font-size="33" text-anchor="middle" font-weight="700" fill="white">C</text><text x="79" y="485" font-size="24" text-anchor="start" font-weight="700" fill="#35776C">TESTE E AVALIAÇÃO</text><rect x="79" y="60" width="340" height="139" rx="6" fill="#F1F6FA" stroke="#245680" stroke-width="1.8"/><text x="94" y="91" font-size="25" text-anchor="start" font-weight="700" fill="#245680">Fonte e auditoria</text><text x="94" y="125" font-size="23" text-anchor="start" font-weight="400" fill="#202A30">10 células da NSRDB</text><text x="94" y="154" font-size="23" text-anchor="start" font-weight="400" fill="#202A30">Brasil, EUA e México</text><text x="94" y="183" font-size="23" text-anchor="start" font-weight="400" fill="#202A30">GHI regular, finita e ≥ 0</text><rect x="457" y="60" width="340" height="139" rx="6" fill="#F1F6FA" stroke="#245680" stroke-width="1.8"/><text x="472" y="91" font-size="25" text-anchor="start" font-weight="700" fill="#245680">Entradas causais</text><text x="472" y="125" font-size="23" text-anchor="start" font-weight="400" fill="#202A30">Histórico de GHI + ID local</text><text x="472" y="154" font-size="23" text-anchor="start" font-weight="400" fill="#202A30">Escala anterior ao corte</text><text x="472" y="183" font-size="23" text-anchor="start" font-weight="400" fill="#202A30">Alvos dentro da partição</text><rect x="835" y="60" width="350" height="139" rx="6" fill="#F1F6FA" stroke="#245680" stroke-width="1.8"/><text x="850" y="91" font-size="25" text-anchor="start" font-weight="700" fill="#245680">Quatro tarefas diretas</text><text x="850" y="125" font-size="23" text-anchor="start" font-weight="400" fill="#202A30">336 h → 72 h; 365 d → 30 d</text><text x="850" y="154" font-size="23" text-anchor="start" font-weight="400" fill="#202A30">12 meses → 1 mês</text><text x="850" y="183" font-size="23" text-anchor="start" font-weight="400" fill="#202A30">12 → 6 meses exploratórios</text><line x1="420" y1="130" x2="454" y2="130" stroke="#52616B" stroke-width="2.4" stroke-dasharray=""/><path d="M446,124 L454,130 L446,136" fill="none" stroke="#52616B" stroke-width="2.4"/><line x1="798" y1="130" x2="832" y2="130" stroke="#52616B" stroke-width="2.4" stroke-dasharray=""/><path d="M824,124 L832,130 L824,136" fill="none" stroke="#52616B" stroke-width="2.4"/><rect x="79" y="282" width="340" height="139" rx="6" fill="#FCF5EF" stroke="#B65B35" stroke-width="1.8"/><text x="94" y="313" font-size="25" text-anchor="start" font-weight="700" fill="#B65B35">Condições de entrada</text><text x="94" y="347" font-size="22.5" text-anchor="start" font-weight="400" fill="#202A30">Contínua, Q64, Q128 ou Q256</text><text x="94" y="376" font-size="23" text-anchor="start" font-weight="400" fill="#202A30">Quantização somente em X</text><text x="94" y="405" font-size="22.5" text-anchor="start" font-weight="400" fill="#202A30">LSTM, Transformer e Informer</text><rect x="457" y="282" width="340" height="139" rx="6" fill="#FCF5EF" stroke="#B65B35" stroke-width="1.8"/><text x="472" y="313" font-size="25" text-anchor="start" font-weight="700" fill="#B65B35">Validação fixa escolhas</text><text x="472" y="347" font-size="23" text-anchor="start" font-weight="400" fill="#202A30">Épocas por variante/semente</text><text x="472" y="376" font-size="21.5" text-anchor="start" font-weight="400" fill="#202A30">Nível pelo macro-MAE completo</text><text x="472" y="405" font-size="23" text-anchor="start" font-weight="400" fill="#202A30">Teste fora da seleção</text><rect x="835" y="282" width="350" height="139" rx="6" fill="#FCF5EF" stroke="#B65B35" stroke-width="1.8"/><text x="850" y="313" font-size="25" text-anchor="start" font-weight="700" fill="#B65B35">Refit e congelamento</text><text x="850" y="347" font-size="23" text-anchor="start" font-weight="400" fill="#202A30">Reiniciar na mesma semente</text><text x="850" y="376" font-size="23" text-anchor="start" font-weight="400" fill="#202A30">Ajuste com dados pré-teste</text><text x="850" y="405" font-size="23" text-anchor="start" font-weight="400" fill="#202A30">Fixar rede, escala e nível</text><line x1="420" y1="352" x2="454" y2="352" stroke="#52616B" stroke-width="2.4" stroke-dasharray=""/><path d="M446,346 L454,352 L446,358" fill="none" stroke="#52616B" stroke-width="2.4"/><line x1="798" y1="352" x2="832" y2="352" stroke="#52616B" stroke-width="2.4" stroke-dasharray=""/><path d="M824,346 L832,352 L824,358" fill="none" stroke="#52616B" stroke-width="2.4"/><rect x="79" y="504" width="340" height="139" rx="6" fill="#F0F7F4" stroke="#35776C" stroke-width="1.8"/><text x="94" y="535" font-size="25" text-anchor="start" font-weight="700" fill="#35776C">Previsões de teste</text><text x="94" y="569" font-size="23" text-anchor="start" font-weight="400" fill="#202A30">Origens com histórico causal</text><text x="94" y="598" font-size="23" text-anchor="start" font-weight="400" fill="#202A30">Vetor futuro contínuo direto</text><text x="94" y="627" font-size="22.5" text-anchor="start" font-weight="400" fill="#202A30">Sem reajustar pesos ou escala</text><rect x="457" y="504" width="340" height="139" rx="6" fill="#F0F7F4" stroke="#35776C" stroke-width="1.8"/><text x="472" y="535" font-size="25" text-anchor="start" font-weight="700" fill="#35776C">Regras comuns</text><text x="472" y="569" font-size="23" text-anchor="start" font-weight="400" fill="#202A30">Inversão; média de sementes</text><text x="472" y="598" font-size="23" text-anchor="start" font-weight="400" fill="#202A30">Piso zero em todas as tarefas</text><text x="472" y="627" font-size="23" text-anchor="start" font-weight="400" fill="#202A30">Noite zerada na tarefa horária</text><rect x="835" y="504" width="350" height="139" rx="6" fill="#F0F7F4" stroke="#35776C" stroke-width="1.8"/><text x="850" y="535" font-size="25" text-anchor="start" font-weight="700" fill="#35776C">Evidência por localidade</text><text x="850" y="569" font-size="21.5" text-anchor="start" font-weight="400" fill="#202A30">MAE, RMSE, nRMSE e R² locais</text><text x="850" y="598" font-size="23" text-anchor="start" font-weight="400" fill="#202A30">Média macro com pesos iguais</text><text x="850" y="627" font-size="23" text-anchor="start" font-weight="400" fill="#202A30">Horizontes cumulativos</text><line x1="420" y1="574" x2="454" y2="574" stroke="#52616B" stroke-width="2.4" stroke-dasharray=""/><path d="M446,568 L454,574 L446,580" fill="none" stroke="#52616B" stroke-width="2.4"/><line x1="798" y1="574" x2="832" y2="574" stroke="#52616B" stroke-width="2.4" stroke-dasharray=""/><path d="M824,568 L832,574 L824,580" fill="none" stroke="#52616B" stroke-width="2.4"/><text x="80" y="689" font-size="24" text-anchor="start" font-weight="400" fill="#52616B">O alvo y e os pesos permanecem contínuos; o ID local não passa pelo quantizador.</text></g></svg>