name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias dos testes
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            joblib==1.5.3 matplotlib==3.10.9 numpy==2.1.3 \
            pandas==2.3.3 pillow==12.2.0 pvlib==0.15.1 \
            python-dotenv==1.2.2 pytest==9.0.3 scikit-learn==1.9.0 \
            scipy==1.15.3 seaborn==0.13.2 xgboost==3.2.0

      - name: Executar suite
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: /tmp/matplotlib-cache
        run: python -m pytest -q
